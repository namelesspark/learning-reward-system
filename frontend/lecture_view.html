<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학습하기</title>
  <link rel="stylesheet" href="lecture_view.css">
</head>
<body>
  <div class="container">
    <div class="lecture-box">
      <header class="top-bar">
        <button id="backBtn" class="back-btn">← 이전으로</button>
        <div class="user-info">
          <button id="userBtn" class="user-btn">👤 <span id="userName">사용자</span></button>
          <div id="logoutBox" class="logout-box hidden">
            <button id="logoutBtn" class="logout-btn">로그아웃</button>
          </div>
        </div>
        <div class="score-box">내 점수: <span id="userScore">0</span></div>
      </header>

      <main class="study-layout">
        <div class="video-area">
          <iframe id="lectureFrame" frameborder="0" allowfullscreen></iframe>
          <div class="quiz-toggle">
            <label>
              <input type="checkbox" id="quizToggle" checked>
              🧩 퀴즈 ON/OFF
            </label>
          </div>
        </div>

        <div class="chat-area">
          <h3>💬 학습 도우미 챗봇</h3>
          <div id="chatBox" class="chat-box">
            <div class="msg bot">안녕하세요! 👋 학습 내용에 대해 질문할 수 있어요.</div>
          </div>
          <div class="chat-input">
            <input id="chatInput" type="text" placeholder="질문을 입력하세요..." />
            <button id="sendBtn">전송</button>
          </div>
        </div>
      </main>
    </div>
  </div>


  <script type="module" src="init-firebase.js"></script>
  <script type="module" src="lecture_view.js"></script>

</body>
</html>
