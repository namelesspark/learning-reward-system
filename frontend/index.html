<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Reward System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="container">
        <!-- 왼쪽: 비디오 섹션 -->
        <div class="video-section">
            <!-- 헤더 -->
            <div class="header">
                <h1>🎓 Learning Reward System</h1>
                <div class="progress-badge">
                    <span class="points">🏆 <span id="totalPoints">0</span>점</span>
                    <span class="streak">🔥 <span id="currentStreak">0</span> 연속</span>
                </div>
            </div>

            <!-- 비디오 입력 -->
            <div class="video-input-area">
                <input 
                    type="text" 
                    id="videoUrl" 
                    placeholder="유튜브 링크를 입력하세요 (예: https://www.youtube.com/watch?v=...)"
                >
                <button onclick="loadVideo()" id="loadBtn">
                    📺 영상 로드
                </button>
            </div>

            <!-- 비디오 플레이어 -->
            <div id="videoPlayer" class="video-player">
                <div class="video-placeholder">
                    <p>👆 유튜브 링크를 입력하고 '영상 로드'를 클릭하세요</p>
                </div>
            </div>

            <!-- 퀴즈 버튼 -->
            <div class="quiz-control">
                <button onclick="generateQuiz()" id="quizBtn" class="quiz-trigger-btn" disabled>
                    ❓ 퀴즈 생성하기
                </button>
            </div>
        </div>

        <!-- 오른쪽: 챗봇 섹션 -->
        <div class="chat-section">
            <!-- 챗봇 헤더 -->
            <div class="chat-header">
                <h2>💬 학습 도우미 챗봇</h2>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">자막 분석 대기 중...</span>
                </div>
            </div>

            <!-- 채팅 메시지 영역 -->
            <div id="chatMessages" class="chat-messages">
                <div class="message assistant">
                    <div class="message-content">
                        안녕하세요! 👋<br>
                        영상을 로드하면 강의 내용에 대해 질문하실 수 있어요.
                    </div>
                </div>
            </div>

            <!-- 채팅 입력 -->
            <div class="chat-input-area">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="궁금한 점을 물어보세요..."
                    onkeypress="if(event.key==='Enter') sendMessage()"
                    disabled
                >
                <button onclick="sendMessage()" id="sendBtn" disabled>
                    전송
                </button>
            </div>
        </div>
    </div>

    <!-- 퀴즈 모달 -->
    <div id="quizModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 학습 퀴즈</h2>
                <button class="close-btn" onclick="closeQuiz()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="quizQuestion" class="quiz-question"></div>
                <div id="quizOptions" class="quiz-options"></div>
            </div>
            <div class="modal-footer">
                <button onclick="submitQuiz()" id="submitQuizBtn" class="submit-btn">
                    제출하기
                </button>
            </div>
        </div>
    </div>

    <!-- 결과 모달 -->
    <div id="resultModal" class="modal">
        <div class="modal-content result-modal">
            <div class="result-header" id="resultHeader">
                <h2 id="resultTitle"></h2>
            </div>
            <div class="modal-body">
                <div id="resultMessage" class="result-message"></div>
                <div id="resultExplanation" class="result-explanation"></div>
                <div id="rewardInfo" class="reward-info"></div>
            </div>
            <div class="modal-footer">
                <button onclick="closeResult()" class="continue-btn">
                    계속 학습하기
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/video-player.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
