<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Learning Reward System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>

<body>
  <!-- 전역 상단바 -->
  <header class="topbar">
    <div class="brand clickable" id="btnGoHome">🎓 Learning Reward System</div>
    <div class="topbar-right">
      <div class="score-pill">🏆 <span id="navPoints">0</span>점</div>
      <div class="user-menu">
        <button id="btnUserMenu" type="button" class="user-btn">👤 <span id="navUserId">게스트</span></button>
        <div class="user-dropdown" id="userDropdown">
          <button id="btnLogout" type="button" class="dropdown-item">로그아웃</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="main-container">
    <!-- 0) 로그인 화면 -->
    <section id="viewLogin" class="view active">
      <div class="auth-card">
        <h1>로그인</h1>
        <div class="field">
          <label for="loginId">아이디</label>
          <input id="loginId" type="text" placeholder="아이디 입력" />
        </div>
        <div class="field">
          <label for="loginPw">비밀번호</label>
          <input id="loginPw" type="password" placeholder="비밀번호 입력" />
        </div>
        <button id="btnLogin" type="button" class="primary">로그인</button>
        <div class="auth-links">
          <button id="btnGoSignup" type="button" class="link">회원가입</button>
          <button id="btnFindId" type="button" class="link">아이디 찾기</button>
          <button id="btnFindPw" type="button" class="link">비밀번호 찾기</button>
        </div>
      </div>
    </section>

    <!-- 1) 회원가입 -->
    <!-- (기존과 동일, 생략 가능 — 코드 유지) -->

    <!-- 4) 메인 화면 -->
    <section id="viewMain" class="view">
      <div class="main-grid">
        <div class="main-card">
          <h2>내 정보</h2>
          <p>아이디: <strong id="mainUserId">-</strong></p>
          <p>현재 점수: <strong id="mainPoints">0</strong>점</p>
          <div class="switch-row">
            <label class="switch">
              <input type="checkbox" id="toggleReward" checked />
              <span class="slider"></span>
            </label>
            <span>학습 리워드 (퀴즈) 사용</span>
          </div>
        </div>

        <div class="main-card">
          <h2>시작하기</h2>
          <div class="row">
            <input id="urlInput" type="text" placeholder="유튜브 링크 입력" />
            <button id="btnStartLearn" type="button" class="primary">학습 시작</button>
          </div>
        </div>

        <div class="main-card">
          <h2>메뉴</h2>
          <div class="row gap">
            <button id="btnGoRanking" type="button" class="secondary">랭킹 확인</button>
            <button id="btnGoShop" type="button" class="secondary" disabled>상점 (준비중)</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 6) 학습 화면 -->
    <section id="viewLearn" class="view">
      <div class="learn-layout">
        <div class="left">
          <div class="learn-header">
            <h1>📺 학습</h1>
            <div class="progress-badge">
              <span class="points">🏆 <span id="totalPoints">0</span>점</span>
              <span class="streak">🔥 <span id="currentStreak">0</span> 연속</span>
            </div>
          </div>

          <div class="video-input-area">
            <input id="videoUrl" type="text" placeholder="유튜브 링크를 입력하세요" />
            <button id="loadBtn" type="button" onclick="loadVideo()">영상 로드</button>
          </div>

          <div id="videoPlayer" class="video-player">
            <div class="video-placeholder"><p>👆 링크 입력 후 '영상 로드'</p></div>
          </div>

          <div class="quiz-control">
            <button id="quizBtn" type="button" class="quiz-trigger-btn" onclick="generateQuiz()" disabled>❓ 퀴즈 생성하기</button>
          </div>

          <div class="focus-panel">
            <div class="focus-row">
              <button id="btnCam" type="button" class="secondary">카메라 켜기</button>
              <span class="focus-hint">집중도: 12분마다 한 칸 상승 / 5칸 = 레벨업</span>
            </div>
            <div class="gauge-wrap">
              <div class="gauge" id="focusGauge"></div>
              <div class="level">LV <span id="focusLevel">1</span></div>
            </div>
            <video id="camView" class="cam" autoplay muted playsinline style="display:none;"></video>
          </div>
        </div>

        <div class="chat-section">
          <div class="chat-header">
            <h2>💬 학습 도우미 챗봇</h2>
            <div class="status-indicator">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">자막 분석 대기 중...</span>
            </div>
          </div>
          <div id="chatMessages" class="chat-messages">
            <div class="message assistant">
              <div class="message-content">안녕하세요! 👋 영상 로드 후 질문해보세요.</div>
            </div>
          </div>
          <div class="chat-input-area">
            <input id="userInput" type="text" placeholder="질문을 입력하세요..." disabled
                   onkeypress="if(event.key==='Enter') sendMessage()" />
            <button id="sendBtn" type="button" onclick="sendMessage()" disabled>전송</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== 모달: 퀴즈 ===== -->
  <div id="quizModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📝 학습 퀴즈</h2>
        <button type="button" class="close-btn" onclick="closeQuiz()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="quizQuestion" class="quiz-question"></div>
        <div id="quizOptions" class="quiz-options"></div>
      </div>
      <div class="modal-footer">
        <button id="submitQuizBtn" type="button" class="submit-btn" onclick="submitQuiz()" disabled>제출하기</button>
      </div>
    </div>
  </div>

  <!-- ===== 모달: 결과 ===== -->
  <div id="resultModal" class="modal">
    <div class="modal-content result-modal">
      <div class="result-header" id="resultHeader"><h2 id="resultTitle"></h2></div>
      <div class="modal-body">
        <div id="resultMessage" class="result-message"></div>
        <div id="resultExplanation" class="result-explanation"></div>
        <div id="rewardInfo" class="reward-info"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="continue-btn" onclick="closeResult()">계속 학습하기</button>
      </div>
    </div>
  </div>

  <!-- ===== 스크립트 로드 순서 수정 ===== -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/video-player.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
