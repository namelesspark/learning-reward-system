<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASH CLASS - Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <div class="dashboard-box">
      <header class="top-bar">
        <div class="user-info">
          <button id="userBtn" class="user-btn">👤 <span id="userName">사용자</span></button>
          <div id="logoutBox" class="logout-box hidden">
            <button id="logoutBtn" class="logout-btn">로그아웃</button>
          </div>
        </div>
        <div class="score-box">
          <span>현재 점수: </span><span id="userScore">0</span>
        </div>
      </header>

      <main class="menu-area">
        <h1>🎓 CASH CLASS</h1>
        <p class="subtitle">메뉴를 선택하세요</p>
        <div class="menu-buttons">
          <button class="menu-btn" onclick="goToRanking()">🏆 내 점수 랭킹</button>
          <button class="menu-btn" onclick="goToLecture()">📚 학습하기</button>
          <button class="menu-btn" onclick="goToStore()">🛍️ 상점</button>
        </div>
      </main>
    </div>
  </div>


  <script type="module" src="init-firebase.js"></script>
<!-- 페이지 스크립트 다음 -->
  <script type="module" src="dashboard.js"></script>


</body>
</html>
