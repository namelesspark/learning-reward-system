<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랭킹</title>
  <link rel="stylesheet" href="ranking.css">
</head>
<body>
  <div class="container">
    <div class="ranking-box">
      <header class="top-bar">
        <button id="backBtn" class="back-btn">← 이전으로</button>

        <div class="user-info">
          <button id="userBtn" class="user-btn">👤 <span id="userName">사용자</span></button>
          <div id="logoutBox" class="logout-box hidden">
            <button id="logoutBtn" class="logout-btn">로그아웃</button>
          </div>
        </div>

        <div class="score-box">
          내 점수: <span id="userScore">0</span>
        </div>
      </header>

      <section class="my-rank">
        <h2>내 랭킹</h2>
        <div class="rank-card">
          <div>순위: <span id="myRank">-</span> 위</div>
          <div>아이디: <span id="myId">-</span></div>
          <div>점수: <span id="myScore">-</span></div>
        </div>
      </section>

      <section class="rank-list">
        <h2>전체 랭킹</h2>
        <div id="rankingContainer" class="ranking-container">
          <!-- 랭킹 목록이 여기에 표시됩니다 -->

        </div>
        <!-- 🔄 수동 새로고침 버튼 + 최근 갱신 시간 -->
        <div class="refresh-box">
            <button id="refreshBtn" class="refresh-btn">🔄 지금 새로고침</button>
            <p class="last-update" id="lastUpdateText">최근 갱신: -</p>
        </div>

      </section>
    </div>
  </div>
