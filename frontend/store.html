<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상점</title>
  <link rel="stylesheet" href="store.css">
</head>
<body>
  <div class="container">
    <div class="store-box">
      <header class="top-bar">
        <button id="backBtn" class="back-btn">← 이전으로</button>
        <div class="score-box">
          내 점수: <span id="userScore">0</span>
        </div>
      </header>

      <h1>🛍️ 상점</h1>
      <p class="subtitle">원하는 상품을 선택하고 점수로 결제하세요</p>

      <div id="productsGrid" class="products-grid"></div>

      <div class="actions">
        <button id="purchaseBtn" class="purchase-btn">결제하기</button>
      </div>
    </div>
  </div>

  <script type="module" src="init-firebase.js"></script>
  <script type="module" src="store.js"></script>

</body>
</html>
